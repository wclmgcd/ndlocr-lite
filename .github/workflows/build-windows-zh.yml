name: Build Windows (Chinese)

# Builds the Chinese-localized NDLOCR-Lite Windows executable on GitHub's
# Windows runner (no local toolchain needed) and uploads it as a downloadable
# artifact. The default UI language is already set to Chinese in
# ndlocr-lite-gui/gui_config.py.
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Version injected into the build (semver, e.g. 1.0.0-zh)"
        required: false
        default: "1.0.0-zh"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # flet 0.86.5 is built against Flutter 3.38.0. Using a newer Flutter
          # (e.g. 3.44.x) ships a Dart SDK that breaks jni 1.0.0's constant
          # evaluation during the Windows native compile ("Constant evaluation
          # error" in jni_flutter / shared_preferences_android). Pin the matched
          # version so the build succeeds.
          flutter-version: '3.38.0'
          channel: 'stable'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Flet build (Windows)
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: |
          cd ndlocr-lite-gui
          echo D | xcopy ..\src .\src /E
          python src\set_version.py ${{ github.event.inputs.build_version }}
          flet build windows --output ..\windows --build-version ${{ github.event.inputs.build_version }}
          copy main.py ..\windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndlocr-lite-windows-zh
          path: windows/
          retention-days: 30
